name: APK Android

# Si avvia a mano da GitHub (Actions → APK Android → Run workflow).
# Impacchetta il sito pubblicato in una Trusted Web Activity: l'app installata
# apre https://roberto2ciancio.github.io/bere-app/ a schermo intero, quindi ogni
# push su main aggiorna anche l'app senza dover rifare l'APK.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @bubblewrap/cli@1.27.0
      # Senza questo file Bubblewrap chiederebbe dove sono JDK e Android SDK.
      # Bubblewrap cerca sdkmanager in <sdk>/bin, sul runner sta in cmdline-tools/latest/bin.
      - run: |
          [ -e "$ANDROID_HOME/bin" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > bere.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: bubblewrap update --skipVersionUpgrade
      - run: bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: rm -f bere.keystore
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: bere-apk
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error
