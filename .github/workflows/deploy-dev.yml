name: Pubblica dev

# Aggiorna solo l'app di prova (/dev/) col codice del ramo. L'app vera alla radice del sito resta quella
# che «Pubblica» (deploy.yml) ha già pubblicato da main: si ricostruisce da quel commit esatto, già testato
# e con le migrazioni già applicate. Qui niente migrazioni e nessun segreto del database per il ramo.
on:
  push:
    branches: [profile-redesign]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # per leggere le esecuzioni di «Pubblica» su main

# Gruppo proprio, non «pages»: in un gruppo condiviso un push sul ramo annullerebbe una pubblicazione
# di main in attesa (con le sue migrazioni). Il controllo prima del deploy evita di sovrascrivere main.
concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      production-sha: ${{ steps.production.outputs.sha }}
    steps:
      - name: Ultimo commit di main pubblicato da «Pubblica»
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$sha" ]; then
            echo "::error::Nessuna pubblicazione riuscita di main: non si sa quale app vera mettere alla radice"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.production.outputs.sha }}
          path: production
      - uses: actions/checkout@v4
        with:
          path: devapp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            devapp/package-lock.json
      - run: npm ci
        working-directory: production
      - run: npm run build
        working-directory: production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - run: npm ci
        working-directory: devapp
      - run: npm test
        working-directory: devapp
      - run: npm run lint
        working-directory: devapp
      # Solo la chiave pubblica: l'app di prova usa il finto backend e non può raggiungere il server.
      - run: npm run build:dev
        working-directory: devapp
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - name: Unisci app vera (da main) e app di prova (dal ramo)
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a production/dist/. dist/
          # Dell'app del ramo entra solo /dev/: la radice resta quella di main.
          rm -rf dist/dev
          cp -a devapp/dist/dev dist/dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  phones:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        timeout-minutes: 20
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-telefoni-dev
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [build, phones]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Mentre questo giro girava, main può aver pubblicato (o star pubblicando) una versione nuova:
      # in quel caso non si pubblica, per non rimettere alla radice un'app vera più vecchia.
      - name: L'app vera è ancora l'ultima di main
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.build.outputs.production-sha }}
        run: |
          set -euo pipefail
          runs="repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&event=push"
          busy=$(gh api "$runs&per_page=20" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then
            echo "::error::«Pubblica» su main è in corso: rilancia questo giro quando ha finito"
            exit 1
          fi
          latest=$(gh api "$runs&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ "$latest" != "$BUILT" ]; then
            echo "::error::main ha pubblicato $latest dopo la costruzione ($BUILT): rilancia questo giro"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
