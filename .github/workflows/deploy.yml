name: Pubblica

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Mai true: annullerebbe l'intera esecuzione, anche una migrazione di produzione in corso.
  # Con false, un push nuovo aspetta; tra più in attesa resta solo l'ultimo.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      # Dopo l'app vera, così il suo service worker non mette in memoria i file dell'app di prova.
      # Riceve solo la chiave pubblica: senza indirizzo del server non può raggiungerlo.
      - run: npm run build:dev
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Test su telefono simulato (iPhone con il motore di Safari, Android con quello di Chrome):
  # se qualcosa si sovrappone o esce dallo schermo, il sito non viene pubblicato.
  # Gira nel contenitore ufficiale di Playwright (stessa versione di package-lock.json: se si aggiorna
  # @playwright/test, aggiornare anche il tag): browser e librerie sono già dentro, niente scaricamenti
  # da apt che a volte si bloccano per ore. Con timeout, un blocco fallisce subito.
  phones:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        timeout-minutes: 20
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-telefoni
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Applica le migrazioni nuove al database vero, solo dopo che i test sono verdi e prima di pubblicare.
  # Senza i segreti il passo salta con un avviso: la pubblicazione prosegue.
  migrate:
    needs: [build, phones]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrazioni del database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Migrazioni saltate: segreti SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD mancanti o vuoti"
            exit 0
          fi
          npx --yes supabase@2.122.1 link --project-ref ecrknwwinnkwdwngkois --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.122.1 db push --yes --skip-vault --password "$SUPABASE_DB_PASSWORD"

  deploy:
    needs: [build, phones, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
