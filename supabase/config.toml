project_id = "bere-app"

# Solo queste impostazioni arrivano al progetto con `supabase config push`.
[auth.email]
enable_confirmations = true
otp_length = 6

[auth.email.template.confirmation]
subject = "Il tuo codice per Bere"
content_path = "./supabase/templates/confirmation.html"

# La chiama pg_cron senza utente: si protegge con l'header x-cron-secret.
[functions.send-reminders]
verify_jwt = false

[auth.email.template.recovery]
subject = "Nuova password per Bere"
content_path = "./supabase/templates/recovery.html"
